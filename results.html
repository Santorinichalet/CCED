<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Live Poll — Results</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <h1 id="title">Live Results</h1>
        <p>Updates live (refresh not required).</p>
      </div>
      <div class="badge"><span id="onlineDot" class="dot off"></span><span id="onlineTxt">Connecting…</span></div>
    </div>

    <div id="missing" class="notice bad" style="display:none">
      Missing event code. Open with <span class="code">?event=ABC123</span>
    </div>

    <div class="grid two" id="top" style="display:none">
      <div class="card">
        <div class="grid">
          <div class="row">
            <div class="kpi" style="flex:1">
              <div class="v" id="kResponses">0</div>
              <div class="t">Responses</div>
            </div>
            <div class="kpi" style="flex:1">
              <div class="v" id="kUpdated">—</div>
              <div class="t">Last update</div>
            </div>
          </div>
          <div class="small">Open this page on a projector/screen.</div>
        </div>
      </div>

      <div class="card">
        <div class="grid">
          <div class="question">
            <p class="qtitle">Event</p>
            <div class="pillrow">
              <span class="pill code" id="eventCode">—</span>
              <a class="pill" id="openParticipant" href="#">Participant link</a>
              <a class="pill" id="openAdmin" href="#">Admin</a>
            </div>
          </div>
          <div class="small">If the organizer changes questions, reload this page.</div>
        </div>
      </div>
    </div>

    <div class="grid" id="content" style="margin-top:14px"></div>

    <footer>
      Results page (results.html).
    </footer>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const qs = new URLSearchParams(location.search);
    const eventId = (qs.get("event") || "").trim();

    const missing = document.getElementById("missing");
    const top = document.getElementById("top");
    const titleEl = document.getElementById("title");
    const content = document.getElementById("content");

    const onlineDot = document.getElementById("onlineDot");
    const onlineTxt = document.getElementById("onlineTxt");
    function setOnline(ok){
      onlineDot.classList.toggle("off", !ok);
      onlineTxt.textContent = ok ? "Connected" : "Offline";
    }
    window.addEventListener("online", () => setOnline(true));
    window.addEventListener("offline", () => setOnline(false));
    setOnline(navigator.onLine);

    if(!eventId){
      missing.style.display = "block";
      setOnline(false);
      throw new Error("Missing event id");
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function baseUrl(){
      const u = new URL(location.href);
      u.pathname = u.pathname.replace(/\/results\.html$/, "/");
      u.search = "";
      u.hash = "";
      return u.toString();
    }

    document.getElementById("eventCode").textContent = eventId;
    document.getElementById("openParticipant").href = baseUrl() + "index.html?event=" + encodeURIComponent(eventId);
    document.getElementById("openAdmin").href = baseUrl() + "admin.html?event=" + encodeURIComponent(eventId);

    const kResponses = document.getElementById("kResponses");
    const kUpdated = document.getElementById("kUpdated");

    const eventRef = doc(db, "events", eventId);
    const eventSnap = await getDoc(eventRef);
    if(!eventSnap.exists()){
      missing.className = "notice bad";
      missing.style.display = "block";
      missing.textContent = `Event "${eventId}" not found. Create it first in admin.html.`;
      throw new Error("Event not found");
    }

    const event = eventSnap.data();
    titleEl.textContent = event.title || `Live Results (${eventId})`;
    top.style.display = "grid";

    const questions = Array.isArray(event.questions) ? event.questions : [];

    function tokenize(text){
      // Simple tokenizer for English/Arabic; keeps letters/numbers, splits on spaces/punct
      return (text || "")
        .toLowerCase()
        .replace(/[\u064B-\u065F]/g, "") // Arabic diacritics
        .replace(/[^\p{L}\p{N}\s]+/gu, " ")
        .split(/\s+/)
        .map(w => w.trim())
        .filter(w => w.length >= 3);
    }

    const stop = new Set(["the","and","for","that","with","this","you","are","was","were","have","has","had","from","but","not","can","will","your","our","their","his","her",
                          "في","على","من","الى","إلى","عن","هذا","هذه","ذلك","تلك","مع","على","لكن","كما","عدم","نحن","هم","هو","هي","كان","كانت","يكون"]);

    function fmtTime(d){
      if(!d) return "—";
      const dt = new Date(d);
      return dt.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    }

    function makeCard(title){
      const card = document.createElement("div");
      card.className = "card";
      const h = document.createElement("div");
      h.className = "brand";
      const h1 = document.createElement("h1");
      h1.style.fontSize = "18px";
      h1.textContent = title;
      h.appendChild(h1);
      card.appendChild(h);
      return card;
    }

    function renderChoice(q, counts, total){
      const box = document.createElement("div");
      box.className = "question";
      const t = document.createElement("p");
      t.className = "qtitle";
      t.textContent = q.prompt;
      box.appendChild(t);

      const opts = q.options || [];
      opts.forEach(opt => {
        const c = counts[opt] || 0;
        const pct = total ? Math.round((c/total)*100) : 0;

        const line = document.createElement("div");
        line.className = "list";

        const top = document.createElement("div");
        top.className = "row";
        top.style.justifyContent = "space-between";
        top.innerHTML = `<div>${opt}</div><div class="code">${c} (${pct}%)</div>`;

        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.style.width = pct + "%";
        bar.appendChild(fill);

        line.appendChild(top);
        line.appendChild(bar);
        box.appendChild(line);
      });

      return box;
    }

    function renderScale(q, dist, total){
      const box = document.createElement("div");
      box.className = "question";
      const t = document.createElement("p");
      t.className = "qtitle";
      t.textContent = q.prompt;
      box.appendChild(t);

      const min = q.min ?? 1;
      const max = q.max ?? 5;
      let sum = 0;
      let cnt = 0;
      for(let v=min; v<=max; v++){
        const c = dist[v] || 0;
        sum += v * c;
        cnt += c;
      }
      const avg = cnt ? (sum / cnt) : 0;

      const k = document.createElement("div");
      k.className = "kpi";
      k.innerHTML = `<div class="v">${avg ? avg.toFixed(2) : "—"}</div><div class="t">Average</div>`;
      box.appendChild(k);

      const hr = document.createElement("div");
      hr.className = "hr";
      box.appendChild(hr);

      for(let v=min; v<=max; v++){
        const c = dist[v] || 0;
        const pct = total ? Math.round((c/total)*100) : 0;

        const row = document.createElement("div");
        row.className = "list";

        const top = document.createElement("div");
        top.className = "row";
        top.style.justifyContent = "space-between";
        top.innerHTML = `<div class="code">${v}</div><div class="code">${c} (${pct}%)</div>`;

        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.style.width = pct + "%";
        bar.appendChild(fill);

        row.appendChild(top);
        row.appendChild(bar);
        box.appendChild(row);
      }

      return box;
    }

    function renderText(q, texts){
      const box = document.createElement("div");
      box.className = "question";
      const t = document.createElement("p");
      t.className = "qtitle";
      t.textContent = q.prompt;
      box.appendChild(t);

      const latest = document.createElement("div");
      latest.className = "list";
      const cap = document.createElement("div");
      cap.className = "small";
      cap.textContent = "Latest answers";
      latest.appendChild(cap);

      const slice = texts.slice(-12).reverse();
      slice.forEach(s => {
        const p = document.createElement("div");
        p.className = "pill";
        p.textContent = s;
        latest.appendChild(p);
      });

      // Common words
      const freq = new Map();
      texts.forEach(s => {
        tokenize(s).forEach(w => {
          if(stop.has(w)) return;
          freq.set(w, (freq.get(w) || 0) + 1);
        });
      });

      const common = Array.from(freq.entries())
        .sort((a,b)=>b[1]-a[1])
        .slice(0, 16);

      const pills = document.createElement("div");
      pills.className = "pillrow";
      common.forEach(([w,c]) => {
        const p = document.createElement("span");
        p.className = "pill";
        p.innerHTML = `<span class="code">${c}</span> ${w}`;
        pills.appendChild(p);
      });

      const hr = document.createElement("div");
      hr.className = "hr";

      const cap2 = document.createElement("div");
      cap2.className = "small";
      cap2.textContent = "Most common words (basic)";

      box.appendChild(latest);
      box.appendChild(hr);
      box.appendChild(cap2);
      box.appendChild(pills);

      return box;
    }

    const responsesCol = collection(db, "events", eventId, "responses");

    onSnapshot(responsesCol, (snap) => {
      const responses = [];
      snap.forEach(d => responses.push(d.data()));
      kResponses.textContent = String(responses.length);
      kUpdated.textContent = fmtTime(Date.now());

      // Aggregate
      const agg = {};
      questions.forEach(q => {
        if(q.type === "choice"){
          agg[q.id] = { counts: {}, total: 0 };
          (q.options||[]).forEach(opt => agg[q.id].counts[opt]=0);
        }else if(q.type === "scale"){
          agg[q.id] = { dist: {}, total: 0 };
          const min=q.min??1, max=q.max??5;
          for(let v=min; v<=max; v++) agg[q.id].dist[v]=0;
        }else if(q.type === "text"){
          agg[q.id] = { texts: [] };
        }else if(q.type === "multi"){
          agg[q.id] = { counts: {}, total: 0 };
          (q.options||[]).forEach(opt => agg[q.id].counts[opt]=0);
        }
      });

      responses.forEach(r => {
        const ans = r.answers || {};
        questions.forEach(q => {
          const v = ans[q.id];
          if(q.type === "choice"){
            if(v && agg[q.id].counts[v] !== undefined){
              agg[q.id].counts[v] += 1;
              agg[q.id].total += 1;
            }
          } else if(q.type === "scale"){
            const n = Number(v);
            if(!Number.isNaN(n) && agg[q.id].dist[n] !== undefined){
              agg[q.id].dist[n] += 1;
              agg[q.id].total += 1;
            }
          } else if(q.type === "text"){
            const s = (v || "").toString().trim();
            if(s) agg[q.id].texts.push(s);
          } else if(q.type === "multi"){
            const arr = Array.isArray(v) ? v : [];
            arr.forEach(opt => {
              if(agg[q.id].counts[opt] !== undefined){
                agg[q.id].counts[opt] += 1;
              }
            });
            if(arr.length) agg[q.id].total += 1;
          }
        });
      });

      // Render
      content.innerHTML = "";
      questions.forEach((q, idx) => {
        const card = makeCard(`Q${idx+1}`);
        const body = document.createElement("div");
        body.className = "grid";

        if(q.type === "choice"){
          body.appendChild(renderChoice(q, agg[q.id].counts, agg[q.id].total));
        } else if(q.type === "scale"){
          body.appendChild(renderScale(q, agg[q.id].dist, agg[q.id].total));
        } else if(q.type === "text"){
          body.appendChild(renderText(q, agg[q.id].texts));
        } else if(q.type === "multi"){
          body.appendChild(renderChoice(q, agg[q.id].counts, responses.length));
        } else {
          const p = document.createElement("div");
          p.className = "notice warn";
          p.textContent = "Unsupported question type: " + q.type;
          body.appendChild(p);
        }

        card.appendChild(body);
        content.appendChild(card);
      });
    });
  </script>
</body>
</html>
