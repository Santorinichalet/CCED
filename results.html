<!doctype html>
<html lang="en">
<head>
  <title>CCED - Results</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#ffffff;color:#0b1b3a}
    .top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e9eef7}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:52px;width:auto;background:#fff;border:1px solid #e9eef7;border-radius:10px;padding:6px}
    .welcome{font-weight:900;font-size:16px}
    .panel{display:grid;grid-template-columns:360px 1fr;gap:22px;padding:18px 22px 90px}
    @media(max-width:980px){.panel{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #e9eef7;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
    .qrBox{background:#fff;border-radius:16px;padding:12px;display:inline-block;border:1px solid #e9eef7}
    .joinBig{font-size:34px;font-weight:900;line-height:1.05;margin:10px 0 6px}
    .code{font-size:44px;font-weight:900;letter-spacing:3px}
    .qTitle{font-size:42px;font-weight:900;line-height:1.12;margin:0 0 16px}
    .bubbleArea{min-height:56vh;display:flex;flex-wrap:wrap;gap:14px;align-content:center;justify-content:center;padding:6px}
    .bubble{background:#eef6ff;border:1px solid #cfe3ff;color:#0b2b55;padding:14px 20px;border-radius:14px;font-weight:900;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
    .bubble.small{font-size:20px}
    .bubble.med{font-size:32px}
    .bubble.big{font-size:50px;padding:16px 24px}
    .bottom{position:fixed; opacity:1 !important; pointer-events:auto;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #e9eef7;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .btn{border:1px solid #e9eef7;background:#f8fafc;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;color:#0b1b3a}
    .btn.primary{background:#0b2b55;color:#fff;border-color:#0b2b55}
    .pill{padding:8px 12px;border-radius:999px;border:1px solid #e9eef7;background:#fff;font-weight:800}
    .muted{color:#64748b;font-size:12px}
  
    #timerBox{background:#0b2b55;color:#fff;border-color:#0b2b55;min-width:90px;text-align:center}
    #timerBox.warn{background:#f59e0b;border-color:#f59e0b}
    #timerBox.danger{background:#ef4444;border-color:#ef4444}


    /* Slido-like control bar */
    #slidoBar{
      position:fixed; opacity:1 !important; pointer-events:auto;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      z-index:99999;
      width:min(1100px, calc(100% - 40px));
      background:rgba(15,23,42,.92);
      border:1px solid rgba(148,163,184,.20);
      border-radius:14px;
      box-shadow:0 18px 40px rgba(2,6,23,.35);
      display:flex;
      align-items:center;
      gap:14px;
      padding:10px 12px;
      backdrop-filter: blur(10px);
    }
    #slidoBar *{color:#e2e8f0}
    .sb-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      height:38px;
      padding:0 12px;
      border-radius:10px;
      border:1px solid rgba(148,163,184,.20);
      background:rgba(255,255,255,.06);
      cursor:pointer;
      user-select:none;
      font-weight:800;
    }
    .sb-btn:hover{background:rgba(255,255,255,.10)}
    .sb-icon{
      width:18px;height:18px;display:inline-block;
    }
    .sb-btn.iconOnly{width:42px;padding:0}
    .sb-btn.danger{
      background:rgba(239,68,68,.18);
      border-color:rgba(239,68,68,.35);
    }
    .sb-btn.danger:hover{background:rgba(239,68,68,.26)}
    .sb-btn.primary{
      background:rgba(255,255,255,.12);
    }
    .sb-divider{
      height:28px;width:1px;background:rgba(148,163,184,.22);
      margin:0 6px;
    }
    .sb-select{
      height:38px;
      border-radius:10px;
      border:1px solid rgba(148,163,184,.22);
      background:rgba(255,255,255,.06);
      padding:0 12px;
      font-weight:900;
      outline:none;
      min-width:240px;
    }
    .sb-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }
    #timerMini{
      font-weight:900;
      min-width:74px;
      text-align:center;
      padding:0 10px;
    }
    body{padding-bottom:60px;}
        #qaModal .panel{
      width:min(860px, 100%);
      background:#ffffff;
      border-radius:18px;
      box-shadow:0 24px 60px rgba(2,6,23,.35);
      overflow:hidden;
    }
    #qaModal .head{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid #e5e7eb;
      font-weight:900;
      color:#0f172a;
    }
    #qaModal .body{
      padding:14px 16px;
      max-height:min(65vh, 560px);
      overflow:auto;
      color:#0f172a;
    }
    #qaModal .row{
      padding:10px 12px;
      border:1px solid #e5e7eb;
      border-radius:12px;
      margin-bottom:10px;
      background:#fafafa;
    }
    #qaModal .meta{font-size:12px;color:#64748b;margin-top:6px}
    #qaModal .close{
      border:none;background:#0f172a;color:#fff;
      border-radius:10px;height:36px;padding:0 12px;cursor:pointer;font-weight:900;
    }


    
    /* Auto-hide minimal control bar (Slido-like) */
    #slidoBar.minimal{
      width: fit-content;
      max-width: calc(100% - 24px);
      padding: 6px 8px;
      gap: 6px;
      border-radius: 14px;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(58px);
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
    }
    #slidoBar.minimal.show{
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #slidoBar.minimal .sb-btn{
      height: 34px;
      border-radius: 10px;
      padding: 0 10px;
      font-weight: 900;
    }
    #slidoBar.minimal .sb-btn.iconOnly{width: 38px; padding: 0;}
    #slidoBar.minimal .sb-divider{height: 22px; margin: 0 4px;}
    #slidoBar.minimal #timerMini{min-width: 64px; height:34px; padding:0 10px; border-radius:10px;}

</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="logo"/>
      <div class="welcome">welcome to CCED forum interactive session</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;"><div class="pill" id="timerBox">01:00</div><div class="muted">Results</div></div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="qrBox" id="qr"></div>
      <div class="joinBig" style="margin-top:14px;">Join</div>
      <div class="muted">Scan the QR or use the code</div>
      <div style="margin-top:14px;" class="code" id="joinCode">------</div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="pill" id="qIndicator">Question</div>
        <div class="pill"><span id="respCount">0</span> responses</div>
      </div>

      <div style="margin-top:14px;" class="qTitle" id="questionTitle"></div>
      <div class="bubbleArea" id="bubbles"></div>
    </div>
  </div>

  
  
  <!-- Minimal control bar -->
  <div id="slidoBar" class="minimal">
    <button class="sb-btn iconOnly" id="prev" title="Previous question"><span class="sb-icon">←</span></button>
    <button class="sb-btn iconOnly" id="next" title="Next question"><span class="sb-icon">→</span></button>

    <div class="sb-divider"></div>

    <button class="sb-btn iconOnly" id="lock" title="Lock / Unlock"><span class="sb-icon">🔒</span></button>
    <button class="sb-btn iconOnly" id="clear" title="Clear responses for this question">🧹</button>

    <div class="sb-divider"></div>

    <button class="sb-btn iconOnly" id="toggleBubbles" title="Hide / Show results"><span class="sb-icon">🙈</span></button>

    <div class="sb-right">
      <div class="sb-btn primary" id="timerMini" title="Time left">01:00</div>
      <button class="sb-btn iconOnly" id="fullscreen" title="Fullscreen">⛶</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // --- Firebase init (defensive) ---
    // firebase-config.js must define window.firebaseConfig = {...}
    if (!window.firebaseConfig) {
      console.error('firebaseConfig missing. Ensure firebase-config.js sets window.firebaseConfig.');
    } else {
      if (!firebase.apps || firebase.apps.length === 0) {
        firebase.initializeApp(window.firebaseConfig);
      }
      // Improve reliability on some mobile / restricted networks
      try { firebase.firestore().settings({ experimentalForceLongPolling: true }); } catch(e) {}
    }
    const db = firebase.firestore();

    const params = new URLSearchParams(location.search);
    const code = params.get('code') || params.get('event') || params.get('join') || params.get('id');

    const elJoin = document.getElementById('joinCode');
    const elQIndicator = document.getElementById('qIndicator');
    const elQTitle = document.getElementById('questionTitle');
    const elBubbles = document.getElementById('bubbles');
    const elResp = document.getElementById('respCount');
    const elEventState = document.getElementById('eventState');
    const elTimerMini = document.getElementById('timerMini');

    let eventId=null, questions=[], currentIndex=0, joinCode=null;
    let timerInterval=null;
    let secondsLeft=60;
    const QUESTION_DURATION = 60; // seconds per question
    let unsubAnswers=null;

    function baseUrl(){
      const u = new URL(location.href);
      const basePath = u.pathname.substring(0, u.pathname.lastIndexOf('/') + 1);
      return u.origin + basePath;
    }

    async function resolveEventId(){
      if(!code) return null;
      const snap = await db.collection('codes').doc(code).get();
      if(!snap.exists) return null;
      const data = snap.data() || {};
      return data.eventId || null;
    }

    function renderBubbles(countMap){
      elBubbles.innerHTML = '';
      const entries = Array.from(countMap.entries()).sort((a,b)=>b[1]-a[1]);
      if(!entries.length){
        const d=document.createElement('div');
        d.className='muted';
        d.textContent='No answers yet.';
        elBubbles.appendChild(d);
        return;
      }
      const max = Math.max(...entries.map(x=>x[1]));
      for(const [text,c] of entries){
        const div=document.createElement('div');
        div.className='bubble';
        const ratio=c/max;
        if(ratio>0.66) div.classList.add('big');
        else if(ratio>0.33) div.classList.add('med');
        else div.classList.add('small');
        div.textContent=text;
        elBubbles.appendChild(div);
      }
    }

    function listenAnswers(){
      if(typeof unsubAnswers==='function') unsubAnswers();
      if(!eventId || !questions.length) return;

      const q = questions[currentIndex];

      let ref = db.collection('events').doc(eventId).collection('answers')
        .where('questionId','==', q.id)
        .orderBy('createdAt','desc')
        .limit(400);

      unsubAnswers = ref.onSnapshot((snap)=>{
        elResp.textContent=String(snap.size);
        if(snap.size===1){ startTimer(); }

        const map=new Map();
        snap.forEach(doc=>{
          const d=doc.data()||{};
          const t=String(d.text||'').trim();
          if(!t) return;
          map.set(t,(map.get(t)||0)+1);
        });
        renderBubbles(map);
      }, (err)=>{
        // fallback if index/network blocks the ordered query
        try{
          let ref2 = db.collection('events').doc(eventId).collection('answers')
            .where('questionId','==', q.id)
            .limit(400);

          unsubAnswers = ref2.onSnapshot((snap)=>{
            elResp.textContent=String(snap.size);
        if(snap.size===1){ startTimer(); }

            const map=new Map();
            snap.forEach(doc=>{
              const d=doc.data()||{};
              const t=String(d.text||'').trim();
              if(!t) return;
              map.set(t,(map.get(t)||0)+1);
            });
            renderBubbles(map);
          });
        }catch(e){}
      });
    }

    function renderHeader(){
      if(!questions.length){
        elQIndicator.textContent='Question';
        elQTitle.textContent='';
        return;
      }
      const q=questions[currentIndex];
      elQIndicator.textContent='Question ' + (currentIndex+1) + ' / ' + questions.length;
      elQTitle.textContent=q.title || '';
    }

    async function setCurrentQuestion(i){
      if(!eventId) return;
      if(i<0) i=0;
      if(i>=questions.length) i=questions.length-1;
      await db.collection('events').doc(eventId).set({ currentQuestion:i }, { merge:true });
    }

    function setupQR(){
      const pLink = baseUrl() + 'index.html?code=' + encodeURIComponent(joinCode || code);
      const qrEl=document.getElementById('qr');
      qrEl.innerHTML='';
      new QRCode(qrEl, { text: pLink, width: 280, height: 280 });
    }

    
    function bindSlidoBar(){
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      const clearBtn = document.getElementById('clear');
      const lockBtn = document.getElementById('lock');
      const fullBtn = document.getElementById('fullscreen');
      const toggleBtn = document.getElementById('toggleBubbles');

      if(prevBtn){
        prevBtn.onclick = async ()=>{ try{ await setCurrentQuestion(currentIndex-1); await handleQuestionChange(); }catch(e){ console.error(e); } };
      }
      if(nextBtn){
        nextBtn.onclick = async ()=>{ try{ await setCurrentQuestion(currentIndex+1); await handleQuestionChange(); }catch(e){ console.error(e); } };
      }
      if(fullBtn){
        fullBtn.onclick = ()=>{ try{ toggleFullscreen(); }catch(e){ console.error(e); } };
      }
      if(clearBtn){
        clearBtn.onclick = async ()=> {
          const ok = confirm("Clear responses for this question?");
          if(!ok) return;
          if(elEventState) elEventState.textContent = "Clearing...";
          try{
            const n = await clearCurrentQuestionAnswers();
            if(elEventState) elEventState.textContent = n ? (`Cleared ${n}`) : "No responses";
          }catch(e){
            console.error(e);
            if(elEventState) elEventState.textContent = "Failed to clear";
          }
          setTimeout(()=>{ if(elEventState) elEventState.textContent=""; }, 2000);
        };
      }
      if(lockBtn){
        lockBtn.onclick = async ()=> {
          stopTimer();
          try{ await setLocked(!locked); }catch(e){ console.error(e); }
        };
      }
      if(toggleBtn){
        let bubblesHidden = false;
        toggleBtn.onclick = ()=> {
          bubblesHidden = !bubblesHidden;
          const bubblesContainer = document.getElementById('bubbles') || document.querySelector('.bubbles');
          if(bubblesContainer) bubblesContainer.style.display = bubblesHidden ? 'none' : '';
          toggleBtn.innerHTML = bubblesHidden ? '<span class="sb-icon">👁</span>' : '<span class="sb-icon">🙈</span>';
        };
      }
    }

    // Ensure bindings happen after DOM is ready
    window.addEventListener('DOMContentLoaded', ()=> {
      bindSlidoBar();
    });
// Auto-hide control bar: show when mouse is near bottom area
    const slidoBar = document.getElementById('slidoBar');
    let hideTimer = null;

    function showBar(){
      if(!slidoBar) return;
      slidoBar.classList.add('show');
      if(hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(()=>slidoBar.classList.remove('show'), 1600);
    }

    function maybeShowBar(e){
      const y = e.clientY;
      const threshold = window.innerHeight - 110;
      if(y >= threshold) showBar();
    }

    window.addEventListener('mousemove', maybeShowBar, { passive:true });
    window.addEventListener('scroll', ()=>showBar(), { passive:true });

    // Keep visible while hovering over the bar
    if(slidoBar){
      slidoBar.addEventListener('mouseenter', ()=>{ if(hideTimer) clearTimeout(hideTimer); slidoBar.classList.add('show'); });
      slidoBar.addEventListener('mouseleave', ()=>{ showBar(); });
      // Show initially for a moment
      setTimeout(()=>showBar(), 300);
    }

</script>
</body>
</html>
