<!doctype html>
<html lang="en">
<head>
  <title>CCED - Results</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#ffffff;color:#0b1b3a}
    .top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e9eef7}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:52px;width:auto;background:#fff;border:1px solid #e9eef7;border-radius:10px;padding:6px}
    .welcome{font-weight:900;font-size:16px}
    .panel{display:grid;grid-template-columns:360px 1fr;gap:22px;padding:18px 22px 90px}
    @media(max-width:980px){.panel{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #e9eef7;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
    .qrBox{background:#fff;border-radius:16px;padding:12px;display:inline-block;border:1px solid #e9eef7}
    .joinBig{font-size:34px;font-weight:900;line-height:1.05;margin:10px 0 6px}
    .code{font-size:44px;font-weight:900;letter-spacing:3px}
    .qTitle{font-size:42px;font-weight:900;line-height:1.12;margin:0 0 16px}
    .bubbleArea{
  min-height:56vh;
  display:flex;
  flex-wrap:wrap;
  gap:10px;                 /* أقل */
  align-content:flex-start; /* بدل center */
  justify-content:center;
  padding:10px;
}

   .bubble{
  background:#eef6ff;
  border:1px solid #cfe3ff;
  color:#0b2b55;
  padding:14px 20px;
  border-radius:14px;
  font-weight:900;

  /* FIX: prevent huge empty spaces */
  white-space:normal;          /* بدل nowrap */
  overflow-wrap:anywhere;      /* يكسر الكلمات الطويلة */
  word-break:break-word;
  max-width:min(920px, 92%);   /* لا تمتد زيادة */
  text-align:center;
}

    .bubble.small{font-size:20px}
    .bubble.med{font-size:32px}
    .bubble.big{font-size:50px;padding:16px 24px}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #e9eef7;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .btn{border:1px solid #e9eef7;background:#f8fafc;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;color:#0b1b3a}
    .btn.primary{background:#0b2b55;color:#fff;border-color:#0b2b55}
    .pill{padding:8px 12px;border-radius:999px;border:1px solid #e9eef7;background:#fff;font-weight:800}
    .pill.timer{background:#0b2b55;color:#fff;border-color:#0b2b55;min-width:92px;text-align:center}
    .pill.timer.warn{background:#f59e0b;border-color:#f59e0b}
    .pill.timer.danger{background:#ef4444;border-color:#ef4444}
    .muted{color:#64748b;font-size:12px}

    /* Slido-like bubble animations */
    @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes floaty { 0%{ transform: translateY(0px);} 50%{ transform: translateY(-10px);} 100%{ transform: translateY(0px);} }
    .bubble{animation: popIn .22s ease-out both, floaty 3.8s ease-in-out infinite; will-change: transform, opacity;}
    .bubble[data-new="1"]{box-shadow:0 14px 32px rgba(2,6,23,.10);}
    .btn.danger{background:#fff5f5;border-color:#fecaca;color:#7f1d1d}
    .btn.locked{background:#0f172a;color:#fff;border-color:#0f172a}
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="logo"/>
      <div class="welcome" id="brandTitle">welcome to CCED forum interactive session</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="pill timer" id="timerPill">WAIT</div>
      <div class="muted">Results</div>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="qrBox" id="qr"></div>
      <div class="joinBig" style="margin-top:14px;">Join</div>
      <div class="muted">Scan the QR or use the code</div>
      <div style="margin-top:14px;" class="code" id="joinCode">------</div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="pill" id="qIndicator">Question</div>
        <div class="pill"><span id="respCount">0</span> responses</div>
      </div>

      <div style="margin-top:14px;" class="qTitle" id="questionTitle"></div>
      <div class="bubbleArea" id="bubbles"></div>
    </div>
  </div>

  <div class="bottom">
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn" id="prev">Prev</button>
      <button class="btn primary" id="next">Next</button>
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="lock">Lock</button>
      <button class="btn danger" id="resetEvent">Reset</button>
    </div>
    <div class="muted" id="eventState"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>

  
  <script>
    // Ensure Firebase is initialized and `db` is available (firebase-config.js only defines window.firebaseConfig)
    (function initFirebase(){
      try{
        const cfg = window.firebaseConfig || window.firebase_config || window.firebaseConfig;
        if(!cfg){ console.error('Missing firebaseConfig'); return; }
        if(!firebase.apps || !firebase.apps.length){
          firebase.initializeApp(cfg);
        }
        if(!window.db) window.db = firebase.firestore();
        // NOTE: do not call db.settings() again here — it's already
        // configured once in firebase-config.js. Calling settings()
        // a second time causes "overriding the original host" and
        // breaks the connection intermittently.
      }catch(e){
        console.error('Firebase init failed', e);
      }
    })();
  </script>

<script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');

    const elJoin = document.getElementById('joinCode');
    const elQIndicator = document.getElementById('qIndicator');
    const elQTitle = document.getElementById('questionTitle');
    const elBubbles = document.getElementById('bubbles');
    const elResp = document.getElementById('respCount');
    const elEventState = document.getElementById('eventState');
    const elLockBtn = document.getElementById('lock');
    const elTimer = document.getElementById('timerPill');

    let eventId=null, questions=[], currentIndex=0, joinCode=null;
    let locked=false;
    let unsubAnswers=null;

    // ===== Timer: starts on FIRST answer only, 60s, then locks this question only =====
    const QUESTION_DURATION = 120;
    let timerStarted = false;
    let timerInterval = null;
    let secondsLeft = QUESTION_DURATION;

    function formatTime(s){
      const m = String(Math.floor(s/60)).padStart(2,'0');
      const ss = String(s%60).padStart(2,'0');
      return `${m}:${ss}`;
    }

    function setTimerStateWaiting(){
      timerStarted = false;
      secondsLeft = QUESTION_DURATION;
      if(elTimer){
        elTimer.textContent = "WAIT";
        elTimer.classList.remove('warn','danger');
      }
    }

    function stopTimer(){
      if(timerInterval){
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateTimerUI(){
      if(!elTimer) return;
      elTimer.textContent = formatTime(Math.max(secondsLeft,0));
      elTimer.classList.remove('warn','danger');
      if(secondsLeft <= 10) elTimer.classList.add('danger');
      else if(secondsLeft <= 20) elTimer.classList.add('warn');
    }

    async function startTimer(){
      if(timerStarted) return;
      if(locked) return; // do not start if already locked
      timerStarted = true;
      stopTimer();
      secondsLeft = QUESTION_DURATION;
      updateTimerUI();

      timerInterval = setInterval(async ()=>{
        secondsLeft--;
        updateTimerUI();
        if(secondsLeft <= 0){
          stopTimer();
          try{
            await setLocked(true);       // lock this question
            if(elTimer){
              elTimer.textContent = "LOCKED";
              elTimer.classList.remove('warn','danger');
            }
          }catch(e){
            console.error(e);
          }
        }
      }, 1000);
    }

    function resetForNewQuestion(){
      stopTimer();
      setTimerStateWaiting();
    }

    function baseUrl(){
      const u = new URL(location.href);
      const basePath = u.pathname.substring(0, u.pathname.lastIndexOf('/') + 1);
      return u.origin + basePath;
    }

    async function resolveEventId(){
      if(!code) return null;
      const snap = await db.collection('codes').doc(code).get();
      if(!snap.exists) return null;
      const data = snap.data() || {};
      return data.eventId || null;
    }

    function renderBubbles(countMap){
      elBubbles.innerHTML = '';
      const entries = Array.from(countMap.entries()).sort((a,b)=>b[1]-a[1]);
      if(!entries.length){
        const d=document.createElement('div');
        d.className='muted';
        d.textContent='No answers yet.';
        elBubbles.appendChild(d);
        return;
      }
      const max = Math.max(...entries.map(x=>x[1]));
      for(const [text,c] of entries){
        const div=document.createElement('div');
        div.className='bubble';
        div.dataset.new = "1";

        const ratio=c/max;
        if(ratio>0.66) div.classList.add('big');
        else if(ratio>0.33) div.classList.add('med');
        else div.classList.add('small');

        const dur = (3.2 + Math.random()*2.6).toFixed(2);
        const delay = (Math.random()*0.8).toFixed(2);
        div.style.animationDuration = `.22s, ${dur}s`;
        div.style.animationDelay = `0s, ${delay}s`;

        div.textContent=text;
        elBubbles.appendChild(div);
      }
    }

    function listenAnswers(){
      if(typeof unsubAnswers==='function') unsubAnswers();
      if(!eventId || !questions.length) return;

      resetForNewQuestion(); // new listener = new question view

      const q = questions[currentIndex];

      let ref = db.collection('events').doc(eventId).collection('answers')
        .where('questionId','==', q.id)
        .orderBy('createdAt','desc')
        .limit(400);

      unsubAnswers = ref.onSnapshot((snap)=>{
        elResp.textContent=String(snap.size);

        // START TIMER ON FIRST ANSWER ONLY
        if(snap.size >= 1 && !timerStarted && !locked){
          startTimer();
        }
        // if locked, show locked status
        if(locked && elTimer){
          elTimer.textContent = "LOCKED";
          elTimer.classList.remove('warn','danger');
        }

        const map=new Map();
        snap.forEach(doc=>{
          const d=doc.data()||{};
          const t=String(d.text||'').trim();
          if(!t) return;
          map.set(t,(map.get(t)||0)+1);
        });
        renderBubbles(map);
      }, (err)=>{
        try{
          let ref2 = db.collection('events').doc(eventId).collection('answers')
            .where('questionId','==', q.id)
            .limit(400);

          unsubAnswers = ref2.onSnapshot((snap)=>{
            elResp.textContent=String(snap.size);

            // START TIMER ON FIRST ANSWER ONLY (fallback too)
            if(snap.size >= 1 && !timerStarted && !locked){
              startTimer();
            }
            if(locked && elTimer){
              elTimer.textContent = "LOCKED";
              elTimer.classList.remove('warn','danger');
            }

            const map=new Map();
            snap.forEach(doc=>{
              const d=doc.data()||{};
              const t=String(d.text||'').trim();
              if(!t) return;
              map.set(t,(map.get(t)||0)+1);
            });
            renderBubbles(map);
          });
        }catch(e){}
      });
    }

    function renderHeader(){
      if(!questions.length){
        elQIndicator.textContent='Question';
        elQTitle.textContent='';
        return;
      }
      const q=questions[currentIndex];
      elQIndicator.textContent=String(currentIndex+1);
      elQTitle.textContent=q.title || '';
    }

    async function setCurrentQuestion(i){
      if(!eventId) return;
      if(i<0) i=0;
      if(i>=questions.length) i=questions.length-1;

      // IMPORTANT: when switching question, unlock + reset timer (timer will start on first answer)
      await db.collection('events').doc(eventId).set({ currentQuestion:i, locked:false }, { merge:true });
    }

    function setupQR(){
      const pLink = baseUrl() + 'index.html?code=' + encodeURIComponent(joinCode || code);
      const qrEl=document.getElementById('qr');
      qrEl.innerHTML='';
      new QRCode(qrEl, { text: pLink, width: 280, height: 280 });
    }

    async function setLocked(nextLocked){
      if(!eventId) return;
      await db.collection('events').doc(eventId).set({ locked: !!nextLocked }, { merge:true });
    }

    async function clearCurrentQuestionAnswers(){
      if(!eventId || !questions.length) return 0;
      const q = questions[currentIndex];

      const snap = await db.collection('events')
        .doc(eventId)
        .collection('answers')
        .where('questionId','==', q.id)
        .get();

      if(snap.empty) return 0;

      let batch = db.batch();
      let n = 0, deleted = 0;

      for(const doc of snap.docs){
        batch.delete(doc.ref);
        n++; deleted++;
        if(n === 450){
          await batch.commit();
          batch = db.batch();
          n = 0;
        }
      }
      if(n > 0) await batch.commit();
      return deleted;
    }

    async function resetEventAll(){
      if(!eventId) return;

      const answersCol = db.collection('events').doc(eventId).collection('answers');

      let totalDeleted = 0;
      while(true){
        const snap = await answersCol.limit(450).get();
        if(snap.empty) break;

        let batch = db.batch();
        for(const doc of snap.docs){
          batch.delete(doc.ref);
          totalDeleted++;
        }
        await batch.commit();
      }

      await db.collection('events').doc(eventId).set({
        currentQuestion: 0,
        locked: false
      }, { merge:true });

      return totalDeleted;
    }

    document.getElementById('prev').onclick=()=>setCurrentQuestion(currentIndex-1);
    document.getElementById('next').onclick=()=>setCurrentQuestion(currentIndex+1);

    document.getElementById('clear').onclick = async () => {
      try{
        const ok = confirm("Clear responses for this question?");
        if(!ok) return;
        elEventState.textContent = "Clearing...";
        const n = await clearCurrentQuestionAnswers();

        // After clear, stop timer and wait again for first answer
        stopTimer();
        setTimerStateWaiting();

        elEventState.textContent = n ? (`Cleared ${n}`) : "No responses";
        setTimeout(()=>elEventState.textContent="", 1800);
      }catch(e){
        console.error(e);
        elEventState.textContent = "Failed to clear";
        setTimeout(()=>elEventState.textContent="", 2000);
      }
    };

    elLockBtn.onclick = async () => {
      try{
        const nextLocked = !locked;
        await setLocked(nextLocked);

        // If manually locked, stop timer and show LOCKED
        if(nextLocked){
          stopTimer();
          if(elTimer){
            elTimer.textContent = "LOCKED";
            elTimer.classList.remove('warn','danger');
          }
        }else{
          // If unlocked manually, go back to waiting (timer starts on first new answer)
          stopTimer();
          setTimerStateWaiting();
        }
      }catch(e){
        console.error(e);
        elEventState.textContent = "Failed to lock/unlock";
        setTimeout(()=>elEventState.textContent="", 2000);
      }
    };

    document.getElementById('resetEvent').onclick = async () => {
      const ok = confirm("RESET event? This will delete ALL responses and unlock + go back to Q1.");
      if(!ok) return;
      try{
        elEventState.textContent = "Resetting...";
        const n = await resetEventAll();

        stopTimer();
        setTimerStateWaiting();

        elEventState.textContent = `Reset done (deleted ${n})`;
        setTimeout(()=>elEventState.textContent="", 2200);
      }catch(e){
        console.error(e);
        elEventState.textContent = "Reset failed";
        setTimeout(()=>elEventState.textContent="", 2200);
      }
    };

    (async function start(){
      if(!code){ elEventState.textContent=''; return; }
      eventId = await resolveEventId();
      if(!eventId){ elEventState.textContent=''; return; }

      const eventRef = db.collection('events').doc(eventId);
      eventRef.onSnapshot((snap)=>{
        if(!snap.exists){ elEventState.textContent=''; return; }
        const data=snap.data()||{};
        // Header title next to the logo (editable from admin)
        const headerTitle = (data.headerTitle) || (data.brand && data.brand.title) || 'welcome to CCED forum interactive session';
        const elBrandTitle = document.getElementById('brandTitle');
        if(elBrandTitle) elBrandTitle.textContent = headerTitle;

        joinCode=data.joinCode || code;
        elJoin.textContent=joinCode;

        questions = Array.isArray(data.questions)?data.questions:[];
        const prevIndex = currentIndex;
        currentIndex = (typeof data.currentQuestion==='number') ? data.currentQuestion : 0;

        locked = !!data.locked;
        if (elLockBtn) {
          elLockBtn.textContent = locked ? 'Unlock' : 'Lock';
          elLockBtn.classList.toggle('locked', locked);
        }

        // If question changed from another device/controller, reset timer state (WAIT)
        if(prevIndex !== currentIndex){
          resetForNewQuestion();
        }

        setupQR();
        renderHeader();
        listenAnswers();
        elEventState.textContent='';
      }, ()=>{ elEventState.textContent=''; });
    })();
  </script>
</body>
</html>
