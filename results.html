<!doctype html>
<html lang="en">
<head>
  <title>CCED - Results</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root" class="container">
    <div class="topbar">
      <div class="brand">
        <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="CCED Logo" />
        <div class="welcome">welcome to CCED forum interactive session</div>
      </div>
      <div class="small">Results</div>
    </div>

    <div id="missing" class="card" style="display:none;">
      Missing event id. Please open the results link generated from admin.html.
    </div>

    <div id="loading" class="card">Loading…</div>

    <div id="main" style="display:none;">
      <div class="card headercard" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div>
          <div id="eventTitle" style="font-weight:900; font-size:18px;"></div>
          <div class="small">Use Next/Prev to move questions. Participant pages will follow automatically.</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="pill"><b id="count">0</b> responses</div>
          <button id="prevBtn" class="secondary">Prev</button>
          <button id="nextBtn">Next</button>
        </div>
      </div>

      <div class="card" style="padding:22px;">
        <div class="navrow" style="margin-top:0;">
          <div class="pill" id="qIndicator">Question</div>
          <div class="small" id="qStats"></div>
        </div>
        <div class="hr"></div>

        <div id="questionTitle" class="bigTitle"></div>
        <div id="cloudHolder"></div>

        <div id="emptyMsg" class="small" style="margin-top:10px; display:none;"></div>

        <div class="hr"></div>

        <div class="navrow">
          <div class="small">
            Mode:
            <label style="display:inline-flex; align-items:center; gap:6px; font-weight:600; margin:0 10px 0 0;">
              <input type="radio" name="mode" value="words" checked> Words
            </label>
            <label style="display:inline-flex; align-items:center; gap:6px; font-weight:600; margin:0;">
              <input type="radio" name="mode" value="phrases"> Full answers (as bubbles)
            </label>
          </div>
          <div class="small">
            Kiosk: add <b>&kiosk=1</b> to URL (hides header) | Debug: <b>&debug=1</b>
          </div>
        </div>

        <div id="debug" class="card" style="display:none; margin-top:14px; border-style:dashed;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.0.1/wordcloud2.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const params = new URLSearchParams(location.search);
    const eventId = params.get('event');
    const kiosk = params.get('kiosk') === '1';
    const debugOn = params.get('debug') === '1';

    if (kiosk) document.body.classList.add('kiosk');
    if (debugOn) document.getElementById('debug').style.display = 'block';

    const elMissing = document.getElementById('missing');
    const elLoading = document.getElementById('loading');
    const elMain = document.getElementById('main');

    const elEventTitle = document.getElementById('eventTitle');
    const elCount = document.getElementById('count');

    const elQIndicator = document.getElementById('qIndicator');
    const elQStats = document.getElementById('qStats');
    const elQuestionTitle = document.getElementById('questionTitle');
    const elCloudHolder = document.getElementById('cloudHolder');
    const elEmpty = document.getElementById('emptyMsg');
    const elDebug = document.getElementById('debug');

    let questions = [];
    let currentIndex = 0;
    const responsesById = new Map();
    let mode = 'words';

    function safeIndex(i) {
      if (!questions.length) return 0;
      if (i < 0) return 0;
      if (i >= questions.length) return questions.length - 1;
      return i;
    }

    const stop = new Set(['the','and','for','with','that','this','from','have','has','are','was','were','you','your','our','to','of','in','on','at','it','as','be','by','or','we','they','their','them','a','an']);

    function tokenize(text) {
      return (text || '')
        .toLowerCase()
        .replace(/[^\w\s'-]/g, ' ')
        .split(/\s+/)
        .map(w => w.trim())
        .filter(w => w.length >= 2 && !stop.has(w));
    }

    function buildWordListForQuestion(qId) {
      const counts = new Map();
      for (const [, r] of responsesById) {
        const t = (r && r.answers && r.answers[qId]) ? String(r.answers[qId]) : '';
        if (!t) continue;
        for (const w of tokenize(t)) {
          counts.set(w, (counts.get(w) || 0) + 1);
        }
      }
      return Array.from(counts.entries()).sort((a,b)=>b[1]-a[1]).slice(0, 120);
    }

    function buildPhraseListForQuestion(qId) {
      const counts = new Map();
      for (const [, r] of responsesById) {
        const t = (r && r.answers && r.answers[qId]) ? String(r.answers[qId]) : '';
        const key = t.trim();
        if (!key) continue;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      return Array.from(counts.entries()).sort((a,b)=>b[1]-a[1]).slice(0, 80);
    }

    function countsPerQuestion() {
      const res = [];
      for (const q of questions) {
        let c = 0;
        for (const [, r] of responsesById) {
          const t = (r && r.answers && r.answers[q.id]) ? String(r.answers[q.id]).trim() : '';
          if (t) c++;
        }
        res.push(c);
      }
      return res;
    }

    let renderTimer = null;
    function scheduleRender() {
      if (renderTimer) clearTimeout(renderTimer);
      renderTimer = setTimeout(renderNow, 120);
    }

    function renderNow() {
      renderTimer = null;

      if (!questions.length) {
        elQIndicator.textContent = 'Question';
        elQuestionTitle.textContent = 'No questions configured.';
        elCloudHolder.innerHTML = '';
        elEmpty.style.display = 'block';
        elEmpty.textContent = 'No questions found in this event.';
        return;
      }

      currentIndex = safeIndex(currentIndex);
      const q = questions[currentIndex];

      const perQ = countsPerQuestion();
      const currentCount = perQ[currentIndex] || 0;

      elQIndicator.textContent = 'Question ' + (currentIndex + 1) + ' / ' + questions.length;
      elQStats.textContent = 'Answers for this question: ' + currentCount + ' | All questions: [' + perQ.join(', ') + ']';
      elQuestionTitle.textContent = q.title || '';

      const list = (mode === 'phrases') ? buildPhraseListForQuestion(q.id) : buildWordListForQuestion(q.id);

      elCloudHolder.innerHTML = '';
      elEmpty.style.display = 'none';

      if (!list.length) {
        elEmpty.style.display = 'block';
        elEmpty.textContent = 'No answers for this question yet. (If you answered a different question, click Next/Prev to match it.)';
        return;
      }

      const width = Math.min(1600, elCloudHolder.clientWidth || 1200);
      const height = kiosk ? Math.max(650, Math.round(window.innerHeight * 0.75)) : 560;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.className = 'cloudCanvas';
      canvas.style.width = '100%';
      elCloudHolder.appendChild(canvas);

      if (typeof WordCloud !== 'function') {
        elEmpty.style.display = 'block';
        elEmpty.textContent = 'WordCloud library failed to load. Add &debug=1 and check console.';
        return;
      }

      // Slido-like sizing: make frequent items MUCH larger
      const maxW = Math.max(...list.map(x => x[1]));
      const weightFactor = (size) => {
        if (mode === 'phrases') {
          // phrases need smaller scaling
          return 18 + (size / maxW) * 42;
        }
        return 20 + (size / maxW) * 70;
      };

      requestAnimationFrame(() => {
        WordCloud(canvas, {
          list,
          weightFactor,
          gridSize: 8,
          backgroundColor: '#ffffff',
          rotateRatio: 0.08,
          rotationSteps: 2,
          minRotation: 0,
          maxRotation: 0.7,
          drawOutOfBound: false,
          shrinkToFit: true,
          minSize: 10
        });
      });

      if (debugOn) {
        elDebug.innerHTML = '<b>Debug</b><br>' +
          'event=' + eventId + '<br>' +
          'qId=' + q.id + '<br>' +
          'responses=' + responsesById.size + '<br>' +
          'listSample=' + list.slice(0,10).map(x => x[0] + ':' + x[1]).join(' | ');
      }
    }

    async function setCurrentQuestion(i) {
      if (!eventId) return;
      i = safeIndex(i);
      await db.collection('events').doc(eventId).set({ currentQuestion: i }, { merge: true });
    }

    function attachResponsesListener(eventRef) {
      eventRef.collection('responses').onSnapshot((qs) => {
        qs.docChanges().forEach((ch) => {
          if (ch.type === 'removed') responsesById.delete(ch.doc.id);
          else responsesById.set(ch.doc.id, ch.doc.data());
        });
        elCount.textContent = String(qs.size);
        scheduleRender();
      }, (err) => {
        console.error(err);
        elEmpty.style.display = 'block';
        elEmpty.textContent = 'Error reading responses: ' + (err && err.message ? err.message : err);
      });
    }

    async function start() {
      if (!eventId) {
        elMissing.style.display = 'block';
        elLoading.style.display = 'none';
        return;
      }

      const eventRef = db.collection('events').doc(eventId);

      eventRef.onSnapshot((snap) => {
        elLoading.style.display = 'none';
        elMain.style.display = 'block';

        if (!snap.exists) {
          elEventTitle.textContent = 'Event not found';
          elQuestionTitle.textContent = 'Ask the facilitator to recreate the event.';
          return;
        }

        const data = snap.data() || {};
        elEventTitle.textContent = data.title || 'CCED Interactive Session';
        questions = Array.isArray(data.questions) ? data.questions : [];
        currentIndex = (typeof data.currentQuestion === 'number') ? data.currentQuestion : 0;

        scheduleRender();
      }, (err) => {
        console.error(err);
        elLoading.textContent = 'Error loading event: ' + (err && err.message ? err.message : err);
      });

      attachResponsesListener(eventRef);

      document.getElementById('prevBtn').addEventListener('click', async () => {
        await setCurrentQuestion(currentIndex - 1);
      });
      document.getElementById('nextBtn').addEventListener('click', async () => {
        await setCurrentQuestion(currentIndex + 1);
      });

      document.querySelectorAll('input[name="mode"]').forEach(r => {
        r.addEventListener('change', () => {
          mode = r.value;
          scheduleRender();
        });
      });

      window.addEventListener('resize', scheduleRender);
    }

    start();
  </script>
</body>
</html>
