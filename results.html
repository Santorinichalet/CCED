<!doctype html>
<html lang="en">
<head>
  <title>CCED - Results</title>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />

</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="CCED Logo" />
        <div class="welcome">welcome to CCED forum interactive session</div>
      </div>
      <div class="small">Results</div>
    </div>

    <div id="header" class="card" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <div>
        <div id="eventTitle" style="font-weight:900; font-size:18px;"></div>
        <div class="small">Word clouds update live as responses come in.</div>
      </div>
      <div class="small"><b id="count">0</b> responses</div>
    </div>

    <div id="clouds"></div>

    <div id="missing" class="card" style="display:none;">
      Missing event id. Please open the results link generated from admin.html.
    </div>
  </div>

  <!-- wordcloud2.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.0.1/wordcloud2.min.js"></script>
  <!-- Firebase v8 (works well with GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>


  <script>
    const params = new URLSearchParams(location.search);
    const eventId = params.get('event');

    const elMissing = document.getElementById('missing');
    const elTitle = document.getElementById('eventTitle');
    const elClouds = document.getElementById('clouds');
    const elCount = document.getElementById('count');

    let questions = [];

    function tokenize(text) {
      return (text || '')
        .toLowerCase()
        .replace(/[^\w\s'-]/g, ' ')
        .split(/\s+/)
        .map(w => w.trim())
        .filter(w => w.length >= 2);
    }

    function buildWordList(textResponses) {
      const counts = new Map();
      for (const t of textResponses) {
        for (const w of tokenize(t)) {
          counts.set(w, (counts.get(w) || 0) + 1);
        }
      }
      return Array.from(counts.entries())
        .sort((a,b) => b[1] - a[1])
        .slice(0, 90);
    }

    function renderCloud(containerEl, list) {
      const canvas = document.createElement('canvas');
      const width = Math.min(1000, containerEl.clientWidth || 1000);
      canvas.width = width;
      canvas.height = 420;
      canvas.style.width = '100%';
      canvas.style.maxWidth = width + 'px';
      containerEl.appendChild(canvas);

      WordCloud(canvas, {
        list,
        weightFactor: 18,
        gridSize: 10,
        backgroundColor: '#ffffff',
        rotateRatio: 0.12,
        rotationSteps: 2,
        minRotation: 0,
        maxRotation: 0.75,
        drawOutOfBound: false
      });
    }

    async function loadEventAndListen() {
      if (!eventId) {
        elMissing.style.display = 'block';
        return;
      }

      const eventRef = db.collection('events').doc(eventId);
      const snap = await eventRef.get();
      if (!snap.exists) {
        elTitle.textContent = 'Event not found';
        return;
      }

      const data = snap.data();
      elTitle.textContent = data.title || 'CCED Interactive Session';
      questions = Array.isArray(data.questions) ? data.questions : [];

      // Build UI containers per question
      elClouds.innerHTML = '';
      const qContainers = {};

      for (const q of questions) {
        const card = document.createElement('div');
        card.className = 'card';

        const h = document.createElement('div');
        h.style.fontWeight = '900';
        h.style.marginBottom = '10px';
        h.textContent = q.title || '';
        card.appendChild(h);

        const holder = document.createElement('div');
        card.appendChild(holder);

        elClouds.appendChild(card);
        qContainers[q.id] = holder;
      }

      // Live listener
      eventRef.collection('responses').onSnapshot((qs) => {
        const responses = qs.docs.map(d => d.data());
        elCount.textContent = String(responses.length);

        for (const q of questions) {
          const texts = responses
            .map(r => (r.answers && r.answers[q.id]) ? String(r.answers[q.id]) : '')
            .filter(Boolean);

          const list = buildWordList(texts);

          const holder = qContainers[q.id];
          if (!holder) continue;

          holder.innerHTML = '';
          if (!list.length) {
            const empty = document.createElement('div');
            empty.className = 'small';
            empty.textContent = 'No responses yet.';
            holder.appendChild(empty);
          } else {
            renderCloud(holder, list);
          }
        }
      }, (err) => {
        console.error(err);
      });
    }

    loadEventAndListen();
  </script>
</body>
</html>
