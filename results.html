<!doctype html>
<html lang="en">
<head>
  <title>CCED - Results</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="brand">
        <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="logo"/>
        <div class="welcome">welcome to CCED forum interactive session</div>
      </div>
      <div class="small">Results</div>
    </div>

    <div class="panel">
      <div class="leftCard">
        <div id="qrWrap" style="display:none;">
          <div class="qrBox" id="qr"></div>
        </div>

        <div style="margin-top:14px;" class="muted">Join at</div>
        <div class="joinBig">Join at</div>
        <div class="joinBig" style="margin-top:-8px;">your link</div>

        <div style="margin-top:18px;" class="muted">Code</div>
        <div class="joinCode" id="joinCode">------</div>

        <div style="margin-top:14px;" class="hint" id="status">Loading…</div>
      </div>

      <div class="mainCard">
        <div class="small" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div class="pill" id="qIndicator">Question</div>
          <div class="hint" id="qStats"></div>
        </div>

        <div style="margin-top:14px;" class="questionTitle" id="questionTitle"></div>

        <div class="bubbleArea" id="bubbles"></div>
      </div>
    </div>

    <div class="bottomBar">
      <div class="controls">
        <button class="btn" id="prev">Prev</button>
        <button class="btn primary" id="next">Next</button>
      </div>
      <div class="controls">
        <div class="pill"><span id="respCount">0</span> responses</div>
        <div class="hint">Kiosk mode is default. Same as Slido layout (QR + Code left, bubbles center).</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');

    const elStatus=document.getElementById('status');
    const elJoin=document.getElementById('joinCode');
    const elQIndicator=document.getElementById('qIndicator');
    const elQStats=document.getElementById('qStats');
    const elQTitle=document.getElementById('questionTitle');
    const elBubbles=document.getElementById('bubbles');
    const elResp=document.getElementById('respCount');

    let eventId=null, questions=[], currentIndex=0, joinCode=null;
    let unsubAnswers=null;

    function baseUrl(){
      const u = new URL(location.href);
      const basePath = u.pathname.substring(0, u.pathname.lastIndexOf('/')+1);
      return u.origin + basePath;
    }

    async function resolveEventId(){
      if(!code) return null;
      const snap = await db.collection('codes').doc(code).get();
      if(!snap.exists) return null;
      const data = snap.data() || {};
      return data.eventId || null;
    }

    function renderBubbles(countMap){
      elBubbles.innerHTML='';
      const entries = Array.from(countMap.entries()).sort((a,b)=>b[1]-a[1]);

      if(!entries.length){
        const d=document.createElement('div');
        d.className='hint';
        d.textContent='No answers yet for this question.';
        elBubbles.appendChild(d);
        return;
      }

      const max = Math.max(...entries.map(x=>x[1]));
      for(const [text,c] of entries){
        const div=document.createElement('div');
        div.className='bubble';

        // Slido-like scaling: repeated => bigger
        const ratio = c / max;
        if(ratio > 0.66) div.classList.add('big');
        else if(ratio > 0.33) div.classList.add('med');
        else div.classList.add('small');

        div.textContent=text;
        elBubbles.appendChild(div);
      }
    }

    function listenAnswers(){
      if(typeof unsubAnswers === 'function') unsubAnswers();

      if(!eventId || !questions.length) return;
      const q = questions[currentIndex];
      const ref = db.collection('events').doc(eventId).collection('answers')
        .where('questionId','==', q.id)
        .orderBy('createdAt','desc')
        .limit(400);

      unsubAnswers = ref.onSnapshot((snap)=>{
        elResp.textContent=String(snap.size);

        const map=new Map();
        snap.forEach(doc=>{
          const d=doc.data()||{};
          const t=String(d.text||'').trim();
          if(!t) return;
          // aggregate identical full answers (bubble mode like slido screenshot)
          map.set(t, (map.get(t)||0)+1);
        });
        renderBubbles(map);
      }, (err)=>{
        console.error(err);
        elStatus.textContent='Cannot read answers. Check Firestore rules.';
      });
    }

    function renderHeader(){
      if(!questions.length){
        elQIndicator.textContent='Question';
        elQTitle.textContent='No questions configured.';
        return;
      }
      const q=questions[currentIndex];
      elQIndicator.textContent='Question ' + (currentIndex+1) + ' / ' + questions.length;
      elQTitle.textContent=q.title || '';
      elQStats.textContent='Live bubbles (same style as Slido).';
    }

    async function setCurrentQuestion(i){
      if(!eventId) return;
      if(i<0) i=0;
      if(i>=questions.length) i=questions.length-1;
      await db.collection('events').doc(eventId).set({ currentQuestion:i }, { merge:true });
    }

    function setupQR(){
      const pLink = baseUrl() + 'index.html?code=' + encodeURIComponent(joinCode || code);
      document.getElementById('qrWrap').style.display='block';
      const qrEl=document.getElementById('qr');
      qrEl.innerHTML='';
      new QRCode(qrEl, { text: pLink, width: 280, height: 280 });
    }

    document.getElementById('prev').onclick=()=>setCurrentQuestion(currentIndex-1);
    document.getElementById('next').onclick=()=>setCurrentQuestion(currentIndex+1);

    (async function start(){
      try{
        if(!code) {
          elStatus.textContent='Missing code. Open the results link from admin.';
          return;
        }
        eventId = await resolveEventId();
        if(!eventId) {
          elStatus.textContent='Invalid code.';
          return;
        }

        const eventRef = db.collection('events').doc(eventId);
        eventRef.onSnapshot((snap)=>{
          if(!snap.exists) {
            elStatus.textContent='Event not found.';
            return;
          }
          const data=snap.data()||{};
          joinCode=data.joinCode || code;
          elJoin.textContent = joinCode;

          questions = Array.isArray(data.questions)?data.questions:[];
          currentIndex = (typeof data.currentQuestion==='number') ? data.currentQuestion : 0;

          renderHeader();
          setupQR();
          listenAnswers();

          elStatus.textContent='Live';
        }, (err)=>{
          console.error(err);
          elStatus.textContent='Cannot read event. Check Firestore rules.';
        });
      }catch(e){
        console.error(e);
        elStatus.textContent='Error: ' + (e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
