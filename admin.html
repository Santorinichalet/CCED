<!doctype html>
<html lang="en">
<head>
  <title>CCED - Admin</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:Arial,sans-serif;background:#fff;margin:0;padding:18px;}
    .wrap{max-width:980px;margin:0 auto;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    @media(max-width:900px){.row{grid-template-columns:1fr;}}
    .card{border:1px solid #e5e7eb;border-radius:14px;padding:16px;}
    label{display:block;font-weight:800;margin:10px 0 6px;}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid #d1d5db;}
    button{border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer;}
    .primary{background:#111;color:#fff;}
    .secondary{background:#f3f4f6;color:#111;border:1px solid #e5e7eb;}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f9fafb;}
    .small{font-size:12px;color:#6b7280;}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
    .brand img{height:52px;background:#fff;border:1px solid #eee;border-radius:10px;padding:6px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="logo"/>
      <div>
        <div style="font-weight:900;">welcome to CCED forum interactive session</div>
        <div class="small">Admin (creates event + share links)</div>
      </div>
    </div>

    <div class="row">
      <div class="card">
        <div style="font-weight:900;font-size:18px;">Create event</div>

        <label>Event title</label>
        <input id="title" placeholder="HSE Interactive Session"/>

        <label>Question 1 (Text)</label>
        <input id="q1" placeholder="Which leadership actions most improve HSE performance?"/>

        <label>Question 2 (Text)</label>
        <input id="q2" placeholder="What leadership gaps affect safe work?"/>

        <label>Question 3 (Text)</label>
        <input id="q3" placeholder="What leadership actions are still needed?"/>

        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
          <button id="create" class="primary">Create</button>
          <button id="reset" class="secondary">Reset</button>
        </div>
        <div id="status" class="small" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <div style="font-weight:900;font-size:18px;">Share</div>

        <label>Join code (show on screen)</label>
        <input id="code" class="mono" readonly/>

        <label>Participant link</label>
        <input id="plink" class="mono" readonly/>
        <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
          <button id="copyP" class="secondary">Copy</button>
        </div>

        <label style="margin-top:14px;">Results link (projector)</label>
        <input id="rlink" class="mono" readonly/>
        <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
          <button id="copyR" class="secondary">Copy</button>
        </div>

        <div class="small" style="margin-top:12px;">
          Note: If Firestore rules are in Production mode (deny), event creation will hang/fail.
          Apply the provided rules first.
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    function baseUrl(){
      const u = new URL(location.href);
      const basePath = u.pathname.substring(0, u.pathname.lastIndexOf('/')+1);
      return u.origin + basePath;
    }
    function genCode(){
      // 6 digits
      return String(Math.floor(100000 + Math.random()*900000));
    }

    const elStatus=document.getElementById('status');
    const elTitle=document.getElementById('title');
    const elQ1=document.getElementById('q1');
    const elQ2=document.getElementById('q2');
    const elQ3=document.getElementById('q3');
    const elCode=document.getElementById('code');
    const elP=document.getElementById('plink');
    const elR=document.getElementById('rlink');

    document.getElementById('reset').onclick=()=>{
      elTitle.value=''; elQ1.value=''; elQ2.value=''; elQ3.value='';
      elCode.value=''; elP.value=''; elR.value='';
      elStatus.textContent='';
    };

    async function copy(v){
      if(!v) return;
      await navigator.clipboard.writeText(v);
    }
    document.getElementById('copyP').onclick=()=>copy(elP.value);
    document.getElementById('copyR').onclick=()=>copy(elR.value);

    document.getElementById('create').onclick=async()=>{
      try{
        elStatus.textContent='Creating...';
        const title=(elTitle.value||'').trim() || 'HSE Interactive Session';
        const q1=(elQ1.value||'').trim() || 'Which leadership actions most improve HSE performance?';
        const q2=(elQ2.value||'').trim() || 'What leadership gaps affect safe work?';
        const q3=(elQ3.value||'').trim() || 'What leadership actions are still needed?';

        const joinCode = genCode();

        // ensure unique joinCode (best-effort)
        const codeDoc = await db.collection('codes').doc(joinCode).get();
        const finalCode = codeDoc.exists ? genCode() : joinCode;

        const docRef = await db.collection('events').add({
          title,
          joinCode: finalCode,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          currentQuestion: 0,
          questions: [
            { id:'q1', title:q1 },
            { id:'q2', title:q2 },
            { id:'q3', title:q3 }
          ]
        });

        await db.collection('codes').doc(finalCode).set({ eventId: docRef.id }, { merge:true });

        const base = baseUrl();
        elCode.value = finalCode;
        elP.value = base + 'index.html?code=' + encodeURIComponent(finalCode);
        elR.value = base + 'results.html?code=' + encodeURIComponent(finalCode) + '&kiosk=1';
        elStatus.textContent='Created. EventId=' + docRef.id;
      }catch(e){
        console.error(e);
        elStatus.textContent='Error: ' + (e && e.message ? e.message : e);
      }
    };
  </script>
</body>
</html>
