<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CCED Load Test</title>
  <style>
    body{font-family:Arial,sans-serif;background:#fff;margin:0;padding:18px;color:#0b1b3a}
    .card{max-width:900px;margin:0 auto;border:1px solid #e9eef7;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    input,select{padding:10px 12px;border:1px solid #d7deea;border-radius:12px;font-size:14px;width:100%}
    label{font-weight:800;font-size:12px;color:#334155}
    .col{flex:1;min-width:210px}
    button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
    .primary{background:#0b2b55;color:#fff}
    .secondary{background:#eef3ff;color:#0b2b55}
    .log{margin-top:12px;background:#0b1220;color:#dbeafe;padding:12px;border-radius:12px;min-height:120px;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap}
    .warn{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:10px;margin-top:12px}
  </style>
</head>
<body>

<div class="card">
  <h2>CCED Load Test</h2>
  <div class="warn">⚠️ Use ONLY for testing, then delete this file.</div>

  <div class="row">
    <div class="col">
      <label>Admin password</label>
      <input id="pw" type="password"/>
    </div>
    <div class="col">
      <label>Join code</label>
      <input id="code"/>
    </div>
    <div class="col">
      <label>Question #</label>
      <select id="qnum">
        <option value="0">1</option>
        <option value="1">2</option>
        <option value="2">3</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Total answers</label>
      <input id="count" type="number" value="150"/>
    </div>
    <div class="col">
      <label>Seconds</label>
      <input id="seconds" type="number" value="60"/>
    </div>
    <div class="col">
      <label>Words (comma separated)</label>
      <input id="words" value="
leadership visibility,
management commitment,
site supervision,
poor supervision,
lack of supervision,
communication,
poor communication,
toolbox talks,
safety meetings,
HSE awareness,
safety culture,
discipline,
accountability,
planning,
poor planning,
risk assessment,
JSA quality,
permit to work,
PTW compliance,
stop work authority,
training,
lack of training,
competency,
incompetence,
experience,
fatigue management,
work pressure,
production pressure,
time pressure,
shortcuts,
procedures,
not following procedures,
procedure compliance,
housekeeping,
poor housekeeping,
unsafe acts,
unsafe conditions,
PPE compliance,
PPE availability,
lead by example,
management presence,
site visits,
field leadership,
visibility in the field,
safety leadership,
behavior based safety,
BBS observations,
coaching,
mentoring,
respect,
no respect,
trust,
no trust,
teamwork,
engagement,
worker involvement,
listening to workers,
ignoring workers,
open communication,
fear of reporting,
blame culture,
just culture,
incident investigation,
learning from incidents,
close out actions,
delay in actions,
weak follow up,
strong follow up,
supervisor attitude,
manager attitude,
safety priority,
production over safety,
safety over production,
contractor management,
contractor supervision,
interface management,
handover quality,
shift handover,
tool availability,
equipment condition,
maintenance issues,
defective tools,
unsafe equipment,
risk control,
hazard identification,
hazard reporting,
near miss reporting,
lack of reporting,
leadership commitment,
leadership support,
leadership engagement,
visible leadership
"/>

    </div>
  </div>

  <div class="row">
    <button class="primary" id="start">Start test</button>
    <button class="secondary" id="stop" disabled>Stop</button>
  </div>

  <div class="log" id="log"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>

<script>
const TEST_PASSWORD = "CCEDTEST2026";

const logEl = document.getElementById('log');
let timer = null, sent = 0, target = 0;

function log(msg){
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

async function getEventId(code){
  const snap = await db.collection('codes').doc(code).get();
  if(!snap.exists) throw "Invalid code";
  return snap.data().eventId;
}

async function getQuestions(eventId){
  const snap = await db.collection('events').doc(eventId).get();
  if(!snap.exists) throw "Event not found";
  return snap.data().questions;
}

async function sendOne(eventId, qid, text){
  await db.collection('events').doc(eventId).collection('answers').add({
    questionId: qid,
    text: text,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

document.getElementById('start').onclick = async ()=>{
  try{
    const pw = document.getElementById('pw').value;
    if(pw !== TEST_PASSWORD){ alert("Wrong password"); return; }

    const code = document.getElementById('code').value.trim();
    const qnum = parseInt(document.getElementById('qnum').value);
    const count = parseInt(document.getElementById('count').value);
    const seconds = parseInt(document.getElementById('seconds').value);
    const words = document.getElementById('words').value.split(',').map(s=>s.trim());

    if(!code) throw "Enter join code";

    log("Resolving event...");
    const eventId = await getEventId(code);
    const questions = await getQuestions(eventId);
    const q = questions[qnum];

    log(`Event: ${eventId}`);
    log(`Question: ${q.title}`);

    sent = 0; target = count;
    const interval = Math.max(120, Math.floor((seconds*1000)/count));

    document.getElementById('start').disabled = true;
    document.getElementById('stop').disabled = false;

    timer = setInterval(async ()=>{
      if(sent >= target){
        clearInterval(timer);
        log("DONE");
        return;
      }
      sent++;

      const phrase = pick(words);
      try{
        await sendOne(eventId, q.id, phrase);
        if(sent % 10 === 0) log(`Sent ${sent}/${target}`);
      }catch(e){
        log("ERROR: " + e);
        clearInterval(timer);
      }
    }, interval);

  }catch(e){
    log("ERROR: " + e);
  }
};

document.getElementById('stop').onclick = ()=>{
  if(timer) clearInterval(timer);
  log("Stopped manually");
  document.getElementById('start').disabled = false;
  document.getElementById('stop').disabled = true;
};
</script>

</body>
</html>
