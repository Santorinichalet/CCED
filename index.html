<!doctype html>
<html lang="en">
<head>
  <title>CCED - Participate</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="CCED Logo" />
        <div class="welcome">welcome to CCED forum interactive session</div>
      </div>
      <div class="small">Participant</div>
    </div>

    <div id="missing" class="card" style="display:none;">
      Missing event id. Please open the participant link generated from admin.html.
    </div>

    <div id="main" class="card" style="display:none;">
      <div id="eventTitle" style="font-weight:900; font-size:18px; margin-bottom:8px;"></div>
      <div class="small" style="margin-bottom:14px;">Please answer the current question shown on the screen.</div>

      <div class="navrow">
        <div class="pill" id="qIndicator">Question</div>
        <div class="small" id="liveNote">Waiting for facilitator…</div>
      </div>

      <div class="hr"></div>

      <div id="questionTitle" style="font-weight:900; font-size:16px; margin-bottom:8px;"></div>
      <textarea id="answer" placeholder="Type your answer..."></textarea>

      <div style="display:flex; gap:10px; margin-top:14px;">
        <button id="submitBtn">Submit</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div id="msg" class="small" style="margin-top:10px;"></div>
    </div>

    <div id="loading" class="card">Loading…</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const params = new URLSearchParams(location.search);
    const eventId = params.get('event');

    const elMissing = document.getElementById('missing');
    const elMain = document.getElementById('main');
    const elLoading = document.getElementById('loading');

    const elEventTitle = document.getElementById('eventTitle');
    const elQIndicator = document.getElementById('qIndicator');
    const elLiveNote = document.getElementById('liveNote');
    const elQuestionTitle = document.getElementById('questionTitle');
    const elAnswer = document.getElementById('answer');
    const elMsg = document.getElementById('msg');

    let questions = [];
    let currentIndex = 0;

    function safeIndex(i) {
      if (!Array.isArray(questions) || questions.length === 0) return 0;
      if (i < 0) return 0;
      if (i >= questions.length) return questions.length - 1;
      return i;
    }

    function getLocalDocId() {
      const key = 'cced_response_' + eventId;
      return localStorage.getItem(key);
    }
    function setLocalDocId(id) {
      const key = 'cced_response_' + eventId;
      localStorage.setItem(key, id);
    }

    function renderCurrentQuestion() {
      if (!questions.length) {
        elQuestionTitle.textContent = 'No questions configured for this event.';
        elQIndicator.textContent = 'Question';
        elLiveNote.textContent = 'Ask the facilitator to recreate the event.';
        return;
      }
      currentIndex = safeIndex(currentIndex);
      const q = questions[currentIndex];

      elQIndicator.textContent = 'Question ' + (currentIndex + 1) + ' / ' + questions.length;
      elQuestionTitle.textContent = q.title || '';
      elLiveNote.textContent = 'This question is controlled by the results screen.';
      elAnswer.value = '';
      elMsg.textContent = '';
    }

    async function ensureResponseDoc() {
      const eventRef = db.collection('events').doc(eventId);
      const responsesRef = eventRef.collection('responses');

      let docId = getLocalDocId();
      if (docId) return responsesRef.doc(docId);

      const docRef = await responsesRef.add({
        answers: {},
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setLocalDocId(docRef.id);
      return docRef;
    }

    async function submitAnswer() {
      try {
        if (!eventId) return;
        if (!questions.length) return;

        const q = questions[currentIndex];
        const text = (elAnswer.value || '').trim();

        if (!text) {
          elMsg.textContent = 'Please type an answer before submitting.';
          return;
        }

        elMsg.textContent = 'Submitting…';

        const docRef = await ensureResponseDoc();
        const update = {};
        update['answers.' + q.id] = text;
        update['updatedAt'] = firebase.firestore.FieldValue.serverTimestamp();

        await docRef.set(update, { merge: true });
        elMsg.textContent = 'Submitted. Thank you!';
      } catch (e) {
        console.error(e);
        elMsg.textContent = 'Error: ' + (e && e.message ? e.message : e);
      }
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      elAnswer.value = '';
      elMsg.textContent = '';
    });
    document.getElementById('submitBtn').addEventListener('click', submitAnswer);

    function start() {
      if (!eventId) {
        elLoading.style.display = 'none';
        elMain.style.display = 'none';
        elMissing.style.display = 'block';
        return;
      }

      const eventRef = db.collection('events').doc(eventId);

      eventRef.onSnapshot((snap) => {
        elLoading.style.display = 'none';
        elMain.style.display = 'block';

        if (!snap.exists) {
          elEventTitle.textContent = 'Event not found';
          elQuestionTitle.textContent = 'Ask the facilitator to recreate the event.';
          return;
        }

        const data = snap.data() || {};
        elEventTitle.textContent = data.title || 'CCED Interactive Session';
        questions = Array.isArray(data.questions) ? data.questions : [];
        currentIndex = typeof data.currentQuestion === 'number' ? data.currentQuestion : 0;
        renderCurrentQuestion();
      }, (err) => {
        console.error(err);
        elLoading.textContent = 'Error loading event.';
      });
    }

    start();
  </script>
</body>
</html>
