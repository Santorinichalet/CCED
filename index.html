<!doctype html>
<html lang="en">
<head>
  <title>CCED - Participate</title>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />

</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="CCED Logo" />
        <div class="welcome">welcome to CCED forum interactive session</div>
      </div>
      <div class="small">Participant</div>
    </div>

    <div id="main" class="card">
      <div id="eventTitle" style="font-weight:800; font-size:18px; margin-bottom:10px;"></div>
      <div class="small" style="margin-bottom:14px;">Answer the questions below. Your response is anonymous unless you type personal details.</div>

      <div id="form"></div>

      <div style="display:flex; gap:10px; margin-top:14px;">
        <button id="submitBtn">Submit</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div id="msg" class="small" style="margin-top:10px;"></div>
    </div>

    <div id="missing" class="card" style="display:none;">
      Missing event id. Please open the participant link generated from admin.html.
    </div>
  </div>

  <!-- Firebase v8 (works well with GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>


  <script>
    const params = new URLSearchParams(location.search);
    const eventId = params.get('event');

    const elMain = document.getElementById('main');
    const elMissing = document.getElementById('missing');
    const elEventTitle = document.getElementById('eventTitle');
    const elForm = document.getElementById('form');
    const elMsg = document.getElementById('msg');

    let questions = [];
    let inputs = {};

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadEvent() {
      if (!eventId) {
        elMain.style.display = 'none';
        elMissing.style.display = 'block';
        return;
      }

      const snap = await db.collection('events').doc(eventId).get();
      if (!snap.exists) {
        elEventTitle.textContent = 'Event not found';
        return;
      }

      const data = snap.data();
      elEventTitle.textContent = data.title || 'CCED Interactive Session';
      questions = Array.isArray(data.questions) ? data.questions : [];
      renderForm();
    }

    function renderForm() {
      elForm.innerHTML = '';
      inputs = {};

      for (const q of questions) {
        const wrap = document.createElement('div');
        wrap.style.marginBottom = '12px';

        const label = document.createElement('label');
        label.textContent = q.title || '';
        wrap.appendChild(label);

        const ta = document.createElement('textarea');
        ta.placeholder = 'Type your answer...';
        ta.maxLength = 300;
        ta.addEventListener('input', () => {
          // keep it short-ish
          if (ta.value.length > 300) ta.value = ta.value.slice(0, 300);
        });
        wrap.appendChild(ta);

        inputs[q.id] = ta;
        elForm.appendChild(wrap);
      }
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      for (const k in inputs) inputs[k].value = '';
      elMsg.textContent = '';
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
      try {
        if (!eventId) return;

        const answers = {};
        for (const q of questions) {
          answers[q.id] = (inputs[q.id].value || '').trim();
        }

        // basic validation: allow empty but encourage at least one
        const hasAny = Object.values(answers).some(v => v && v.length > 0);
        if (!hasAny) {
          elMsg.textContent = 'Please answer at least one question.';
          return;
        }

        elMsg.textContent = 'Submitting...';

        // one submission per browser by default
        const key = 'cced_response_' + eventId;
        const existingId = localStorage.getItem(key);

        if (existingId) {
          await db.collection('events').doc(eventId).collection('responses').doc(existingId).set({
            answers,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          elMsg.textContent = 'Updated. Thank you!';
          return;
        }

        const docRef = await db.collection('events').doc(eventId).collection('responses').add({
          answers,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        localStorage.setItem(key, docRef.id);

        elMsg.textContent = 'Submitted. Thank you!';
      } catch (e) {
        console.error(e);
        elMsg.textContent = 'Error: ' + (e && e.message ? e.message : e);
      }
    });

    loadEvent();
  </script>
</body>
</html>
