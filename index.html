<!doctype html>
<html lang="en">
<head>
  <title>CCED - Participate</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#0b1b3a}
    .wrap{max-width:900px;margin:0 auto;padding:18px 18px 90px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 16px;border-bottom:1px solid #e9eef7}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:50px;width:auto}
    .title{font-weight:900}
    .card{background:#fff;border:1px solid #e9eef7;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
    textarea{width:100%;min-height:150px;padding:12px 14px;border-radius:14px;border:1px solid #d7deea;outline:none;font-size:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}
    .primary{background:#0b2b55;color:#fff}
    .secondary{background:#eef3ff;color:#0b2b55}
    .pill{padding:8px 12px;border-radius:999px;border:1px solid #e9eef7;background:#fff;font-weight:800}
    .muted{color:#64748b;font-size:12px}
    .msg{margin-top:10px;font-size:13px;color:#334155}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img src="https://i.ibb.co/5xhDVpxs/1.png" alt="logo"/>
        <div>
          <div class="title">welcome to CCED forum interactive session</div>
          <div class="muted">Participant</div>
        </div>
      </div>
      <div class="muted">Live</div>
    </div>

    <div id="loading" class="card">Loading…</div>
    <div id="err" class="card" style="display:none;border-color:#fecaca;background:#fff5f5;color:#7f1d1d;"></div>

    <div id="main" class="card" style="display:none;">
      <div style="font-weight:900;font-size:18px;" id="eventTitle"></div>
      <div class="muted" style="margin-top:4px;">Answer the current question shown on the screen.</div>

      <div style="margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <div class="pill" id="qIndicator">Question</div>
        <div class="muted">Controlled by results screen</div>
      </div>

      <div style="margin-top:14px;font-size:22px;font-weight:900;" id="questionTitle"></div>

      <div style="margin-top:10px;">
        <textarea id="answer" placeholder="Type your answer..."></textarea>
      </div>

      <div class="row">
        <button id="submit" class="primary">Submit</button>
        <button id="clear" class="secondary">Clear</button>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>

  
  <script>
    // --- Firebase init (robust) ---
    // If firebase-config.js defines firebaseConfig, we use it. Otherwise fallback to embedded config.
    const __fallbackFirebaseConfig = {
      apiKey: "AIzaSyA8ovxv3cGURJ_6XSbf3ICoMOPHDHLM9Sc",
      authDomain: "cced-74ca6.firebaseapp.com",
      projectId: "cced-74ca6",
      storageBucket: "cced-74ca6.firebasestorage.app",
      messagingSenderId: "940577322588",
      appId: "1:940577322588:web:86030574b4621973e55899",
      measurementId: "G-WCF55SSPKY"
    };

    const __cfg = (typeof firebaseConfig !== "undefined") ? firebaseConfig : __fallbackFirebaseConfig;

    try{
      if(!firebase.apps || !firebase.apps.length){
        firebase.initializeApp(__cfg);
      }
    }catch(e){
      // ignore "already exists"
    }

    const db = firebase.firestore();
    // --- End Firebase init ---
const params = new URLSearchParams(location.search);
    const code = params.get('code');

    const elLoading=document.getElementById('loading');
    const elErr=document.getElementById('err');
    const elMain=document.getElementById('main');
    const elEventTitle=document.getElementById('eventTitle');
    const elQIndicator=document.getElementById('qIndicator');
    const elQTitle=document.getElementById('questionTitle');
    const elAnswer=document.getElementById('answer');
    const elMsg=document.getElementById('msg');

    let eventId=null, questions=[], currentIndex=0, locked=false;

    function showError(t){
      elLoading.style.display='none';
      elMain.style.display='none';
      elErr.style.display='block';
      elErr.textContent=t;
    }

    function render(){
      if(!questions.length){
        elQIndicator.textContent='Question';
        elQTitle.textContent='';
        return;
      }
      const q=questions[currentIndex] || questions[0];
      elQIndicator.textContent='Question ' + (currentIndex+1) + ' / ' + questions.length;
      elQTitle.textContent=q.title || '';
      elAnswer.value='';
      elMsg.textContent='';

      // Disable input if locked
      const btn=document.getElementById('submit');
      if(locked){
        elAnswer.disabled = true;
        btn.disabled = true;
        btn.style.opacity = '0.6';
        elMsg.textContent = 'This question is locked.';
      }else{
        elAnswer.disabled = false;
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    async function resolveEventId(){
      if(!code) return null;
      const snap = await db.collection('codes').doc(code).get();
      if(!snap.exists) return null;
      const data = snap.data() || {};
      return data.eventId || null;
    }

    async function submit(){
      const text=(elAnswer.value||'').trim();
      if(!text){ elMsg.textContent='Please type an answer.'; return; }
      if(!eventId) return;
      if(locked){ elMsg.textContent='This question is locked.'; return; }

      const btn=document.getElementById('submit');
      btn.disabled=true; btn.style.opacity='0.7';
      elMsg.textContent='Submitting...';

      try{
        const q=questions[currentIndex];
        await db.collection('events').doc(eventId).collection('answers').add({
          questionId: q.id,
          text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        elMsg.textContent='Submitted. Thank you!';
        setTimeout(()=>{ elAnswer.value=''; }, 400);
      }catch(e){
        console.error(e);
        const msg = (e && e.message) ? e.message : String(e);
        if(msg.toLowerCase().includes('permission') || msg.toLowerCase().includes('insufficient')){
          elMsg.textContent='Cannot submit: permissions blocked (check Firestore Rules).';
        }else{
          elMsg.textContent='Cannot submit: network or connection issue. Try another network/browser.';
        }
      }finally{
        btn.disabled=false; btn.style.opacity='1';
      }
    }

    document.getElementById('clear').onclick=()=>{ elAnswer.value=''; elMsg.textContent=''; };
    document.getElementById('submit').onclick=submit;

    (async function start(){
      try{
        eventId = await resolveEventId();
        if(!eventId) return showError('Invalid join code. Please scan the correct QR / link.');

        const eventRef = db.collection('events').doc(eventId);
        eventRef.onSnapshot((snap)=>{
          if(!snap.exists) return showError('Event not found. Ask facilitator to recreate.');
          const data=snap.data()||{};
          questions = Array.isArray(data.questions)?data.questions:[];
          currentIndex = (typeof data.currentQuestion==='number') ? data.currentQuestion : 0;
          locked = !!data.locked;
          elEventTitle.textContent = data.title || 'HSE Interactive Session';

          elLoading.style.display='none';
          elErr.style.display='none';
          elMain.style.display='block';
          render();
        }, (err)=>{
          console.error(err);
          showError('Cannot read event. Check network access and Firestore Rules.');
        });
      }catch(e){
        console.error(e);
        showError('Error loading.');
      }
    })();
  </script>
</body>
</html>
